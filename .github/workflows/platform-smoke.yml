name: Platform smoke tests

on:
  push:
    branches:
      - ai-agent-dev
  workflow_dispatch:

jobs:
  platform-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API
        run: |
          mkdir -p /tmp/social_media_downloader
          nohup uvicorn app:app --host 127.0.0.1 --port 10000 > /tmp/api.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:10000/health && exit 0
            sleep 2
          done
          cat /tmp/api.log
          exit 1

      - name: Test Instagram and Facebook URLs
        run: |
          python - <<'PY'
          import requests
          import sys

          tests = {
              "instagram": "https://www.instagram.com/reel/DcbIMbLP35E/",
              "facebook": "https://www.facebook.com/share/v/18VR2oCjGY/",
          }

          failed = False
          for platform, url in tests.items():
              print(f"=== {platform.upper()} INFO ===")
              try:
                  r = requests.post(
                      "http://127.0.0.1:10000/api/info",
                      json={"url": url},
                      timeout=120,
                  )
                  print("INFO status:", r.status_code)
                  print("INFO body:", r.text[:2000])
                  if not r.ok:
                      failed = True
                      continue

                  print(f"=== {platform.upper()} DOWNLOAD ===")
                  with requests.post(
                      "http://127.0.0.1:10000/api/download",
                      json={"url": url, "quality": "1080p"},
                      stream=True,
                      timeout=(20, 240),
                  ) as d:
                      print("DOWNLOAD status:", d.status_code)
                      print("CONTENT-TYPE:", d.headers.get("content-type"))
                      print("CONTENT-DISPOSITION:", d.headers.get("content-disposition"))
                      sample = next(d.iter_content(chunk_size=65536), b"")
                      print("SAMPLE BYTES:", len(sample))
                      if d.status_code != 200 or not (d.headers.get("content-type") or "").lower().startswith("video/"):
                          failed = True
              except Exception as exc:
                  print("TEST ERROR:", repr(exc))
                  failed = True

          if failed:
              print("One or more platform tests failed.")
              sys.exit(1)
          print("Instagram and Facebook platform smoke tests passed.")
          PY

      - name: Dump API log on failure
        if: failure()
        run: cat /tmp/api.log
