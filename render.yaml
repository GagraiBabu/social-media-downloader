services:
  - type: web
    name: social-media-downloader-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Decodo Residential Proxy
      - key: DECODO_PROXY_ENABLED
        value: "true"
      - key: DECODO_HOST
        value: dc.decodo.com
      - key: DECODO_PORT
        value: "10001"
      - key: DECODO_COUNTRY
        value: ""
      - key: DECODO_SESSION
        value: ""
      - key: DECODO_ROTATE
        value: "true"
      - key: DECODO_PROXY_MEDIA
        value: "false"
      - key: DECODO_USERNAME
        sync: false
      - key: DECODO_PASSWORD
        sync: false

      # App tuning
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: YTDLP_RETRIES
        value: "2"
      - key: YTDLP_FRAGMENT_RETRIES
        value: "1"
      - key: INFO_TIMEOUT_SECONDS
        value: "30"
      - key: DOWNLOAD_TIMEOUT_SECONDS
        value: "180"
      - key: UVICORN_LIMIT_CONCURRENCY
        value: "16"
